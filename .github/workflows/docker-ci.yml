name: CI/CD Docker

on:
  push:
    branches:
      - main

jobs:
  docker_build_deploy:   
    name: Docker Build & Deploy
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
         username: sooscode
         password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and push Docker image
        shell: powershell -ExecutionPolicy Bypass -Command "{0}"
        run: |
          docker build -t sooscode/flask_app_lives:latest .
          docker push sooscode/flask_app_lives:latest
     
      - name: Deploy locally
        shell: powershell -ExecutionPolicy Bypass -Command "{0}"
        run: .\deploy.ps1


